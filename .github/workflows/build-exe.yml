name: Build exe

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create (example v1.0.0). Leave blank to only save a build artifact.
        required: false
        default: v1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build StartupManager.exe
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\Build-Exe.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StartupManager
          path: dist/StartupManager.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/StartupManager.exe
          generate_release_notes: true
          draft: false
          prerelease: false
